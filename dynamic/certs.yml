# TLS 证书配置
# 使用动态配置文件定义证书，避免 Docker labels 语法问题
# 证书文件从 Vault Websites 读取：/volume1/Projects/NebulaForgeX/NFX-Vault/Websites/nebulaforgex

tls:
  certificates:
    # nebulaforgex.com 证书
    - certFile: /certs/websites/nebulaforgex/cert.crt
      keyFile: /certs/websites/nebulaforgex/key.key
      stores:
        - default
