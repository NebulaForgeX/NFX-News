  console:
    image: node:22-bookworm-slim
    container_name: NFX-News-Console-Dev
    working_dir: /app
    volumes:
      - ./console:/app
    command: ["node", "node_modules/vite/bin/vite.js", "--mode", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
      VITE_PORT: ${VITE_PORT}
      VITE_BASE: ${VITE_BASE}
      DOCKER: "1"
    expose:
      - "${VITE_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.docker.network: nfx-edge
      traefik.http.services.news-console.loadbalancer.server.port: "${VITE_PORT}"
      traefik.http.routers.news-console.entrypoints: web
      traefik.http.routers.news-console.rule: PathPrefix(`/console/nfx-news`)
      traefik.http.routers.news-console.service: news-console
      traefik.http.routers.news-console.priority: "25"
      traefik.http.routers.news-console-tls.entrypoints: websecure
      traefik.http.routers.news-console-tls.rule: PathPrefix(`/console/nfx-news`)
      traefik.http.routers.news-console-tls.service: news-console
      traefik.http.routers.news-console-tls.tls: "true"
      traefik.http.routers.news-console-tls.priority: "25"
    init: true
    networks:
      - nfx-news
      - nfx-edge

networks:
  nfx-news:
    name: nfx-news
    driver: bridge
  nfx-edge:
    external: true
    name: nfx-edge
  nfx-stack:
    external: true
    name: nfx-stack
