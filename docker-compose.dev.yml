name: nfx-news-dev

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  source-base:
    image: nfx-news-source-base:dev
    container_name: NFX-News-Source-Base-Dev
    build:
      context: .
      dockerfile: inputs/source/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/source/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SOURCE}"
    ports:
      - "${GRPC_EXT_PORT_SOURCE}:${GRPC_PORT_SOURCE}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.docker.network: nfx-edge
      traefik.http.services.news-source-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.news-source-base.entrypoints: web
      traefik.http.middlewares.nfx-news-source-gw.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.news-source-base.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-base.priority: "20"
      traefik.http.routers.news-source-base.middlewares: nfx-news-source-gw
      traefik.http.routers.news-source-base.service: news-source-base
      traefik.http.routers.news-source-base-tls.entrypoints: websecure
      traefik.http.routers.news-source-base-tls.rule: PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-base-tls.priority: "20"
      traefik.http.routers.news-source-base-tls.middlewares: nfx-news-source-gw
      traefik.http.routers.news-source-base-tls.service: news-source-base
      traefik.http.routers.news-source-base-tls.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    develop:
      watch:
        - action: sync
          path: inputs/source/base
          target: /app/inputs/source/base
        - action: sync
          path: inputs/source/configuration
          target: /app/inputs/source/configuration
        - action: sync
          path: modules/source
          target: /app/modules/source
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/source/configuration/Dockerfile.Base
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
      - nfx-edge
      - nfx-stack

