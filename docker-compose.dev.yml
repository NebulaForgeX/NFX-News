name: nfx-news-dev

services:
  reverse-proxy:
    image: traefik:latest
    container_name: NFX-News-Reverse-Proxy-Dev
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.project`, `nfx-news`)
      - --entrypoints.web.address=:${TRAEFIK_HTTP_INTERNAL_PORT}
      - --entrypoints.traefik.address=:${TRAEFIK_DASHBOARD_INTERNAL_PORT}
    ports:
      - "${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_INTERNAL_PORT}"
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_INTERNAL_PORT}"
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_INTERNAL_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    restart: unless-stopped


  source-base:
    image: nfx-news-source-base:dev
    container_name: NFX-News-Source-Base-Dev
    build:
      context: .
      dockerfile: inputs/source/base/Dockerfile
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/source/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SOURCE}"
    ports:
      - "${GRPC_PORT_SOURCE}:${GRPC_PORT_SOURCE}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.routers.source-base.entrypoints: web
      traefik.http.routers.source-base.rule: PathPrefix(`${API_PREFIX_PATH_SOURCE}`)
      traefik.http.services.source-base.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    depends_on:
      reverse-proxy:
        condition: service_started

  news-base:
    image: nfx-news-news-base:dev
    container_name: NFX-News-News-Base-Dev
    build:
      context: .
      dockerfile: inputs/news/base/Dockerfile
      target: dev
