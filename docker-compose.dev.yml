  console:
    image: node:22-bookworm-slim
    container_name: NFX-News-Console-Dev
    working_dir: /app
    volumes:
      - ./console:/app
    command: ["node", "node_modules/vite/bin/vite.js", "--mode", "dev", "--host", "0.0.0.0"]
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
      VITE_PORT: ${VITE_PORT}
      VITE_BASE: ${VITE_BASE}
      DOCKER: "1"
    expose:
      - "${VITE_PORT}"
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${VITE_PORT}"
    init: true
