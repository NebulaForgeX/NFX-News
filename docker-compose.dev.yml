      traefik.http.routers.system-base.rule: PathPrefix(`${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.services.system-base.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    depends_on:
      reverse-proxy:
        condition: service_started

  console:
    image: nfx-news-console:dev
    container_name: NFX-News-Console-Dev
    build:
      context: ./console
      dockerfile: Dockerfile
      additional_contexts:
        nfx-ui: ../NFX-UI
      target: prod
    ports:
      - "${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.routers.console.entrypoints: web
      traefik.http.routers.console.rule: PathPrefix(`/`)
      traefik.http.routers.console.priority: "1"
      traefik.http.services.console.loadbalancer.server.port: "${CONSOLE_PORT}"
    networks:
      - nfx-news

networks:
  nfx-news:
    name: nfx-news
    driver: bridge
