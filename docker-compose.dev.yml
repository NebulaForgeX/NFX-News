      - ENV=dev
    command: [ "air", "-c", "inputs/news/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_NEWS}"
    ports:
      - "${GRPC_PORT_NEWS}:${GRPC_PORT_NEWS}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.routers.news-base.entrypoints: web
      traefik.http.routers.news-base.rule: PathPrefix(`${API_PREFIX_PATH_NEWS}`)
      traefik.http.services.news-base.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    depends_on:
      reverse-proxy:
        condition: service_started

  crawl-base:
    image: nfx-news-crawl-base:dev
    container_name: NFX-News-Crawl-Base-Dev
    build:
      context: .
      dockerfile: inputs/crawl/base/Dockerfile
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/crawl/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_CRAWL}"
    ports:
      - "${GRPC_PORT_CRAWL}:${GRPC_PORT_CRAWL}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.routers.crawl-base.entrypoints: web
      traefik.http.routers.crawl-base.rule: PathPrefix(`${API_PREFIX_PATH_CRAWL}`)
      traefik.http.services.crawl-base.loadbalancer.server.port: "${HTTP_PORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    depends_on:
