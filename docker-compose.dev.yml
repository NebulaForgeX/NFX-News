name: nfx-news-dev
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  source-base:
    image: nfx-news-source-base:dev
    container_name: NFX-News-Source-Base-Dev
    build:
      context: .
      dockerfile: inputs/source/configuration/Dockerfile.Base
      target: dev
    environment:
      - ENV=dev
    command: [ "air", "-c", "inputs/source/base/.air.toml" ]
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SOURCE}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_SOURCE}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_SOURCE}:${GRPC_PORT_SOURCE}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    develop:
      watch:
        - action: sync
          path: inputs/source/base
          target: /app/inputs/source/base
        - action: sync
          path: inputs/source/configuration
          target: /app/inputs/source/configuration
        - action: sync
          path: modules/source
          target: /app/modules/source
        - action: sync
          path: enums
          target: /app/enums
        - action: sync
          path: errors/src
          target: /app/errors/src
        - action: sync
          path: pkgs
          target: /app/pkgs
        - action: sync
          path: protos
          target: /app/protos
        - action: sync
          path: go.mod
          target: /app/go.mod
        - action: sync
          path: go.sum
          target: /app/go.sum
        - action: sync
          path: .env
          target: /app/.env
        - action: rebuild
          path: inputs/source/configuration/Dockerfile.Base

  news-base:
