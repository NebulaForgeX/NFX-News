map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    client_max_body_size 0;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /console/nfx-news {
        return 301 /console/nfx-news/;
    }

    location /console/nfx-news/ {
        try_files $uri $uri/ /console/nfx-news/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # LAN 直连端口时的接口转发（与 Traefik 去掉前缀后的后端一致）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 600s;

    location ^~ /nfx-news/source/ {
        proxy_pass http://${NAS_IP}:10063/source/;
    }

    location ^~ /nfx-news/news/ {
        proxy_pass http://${NAS_IP}:10065/news/;
    }

    location ^~ /nfx-news/crawl/ {
        proxy_pass http://${NAS_IP}:10067/crawl/;
    }

    location ^~ /nfx-news/report/ {
        proxy_pass http://${NAS_IP}:10069/report/;
    }

    location ^~ /nfx-news/notify/ {
        proxy_pass http://${NAS_IP}:10071/notify/;
    }

    location ^~ /nfx-news/mcp/ {
        proxy_pass http://${NAS_IP}:10073/mcp/;
    }

    location ^~ /nfx-identity/auth/ {
        proxy_pass http://${NAS_IP}:10035/auth/;
    }

    location ^~ /nfx-identity/asset/ {
        proxy_pass http://${NAS_IP}:10037/asset/;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 错误页面
    error_page 404 /index.html;
}
