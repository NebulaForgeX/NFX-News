      traefik.http.routers.news-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_NEWS}`)
      traefik.http.routers.news-base-secure.priority: "20"
      traefik.http.routers.news-base-secure.middlewares: nfx-news-news-gw-secure
      traefik.http.routers.news-base-secure.service: news-base-secure
      traefik.http.routers.news-base-secure-tls.entrypoints: websecure
      traefik.http.routers.news-base-secure-tls.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_NEWS}`)
      traefik.http.routers.news-base-secure-tls.priority: "20"
      traefik.http.routers.news-base-secure-tls.middlewares: nfx-news-news-gw-secure
      traefik.http.routers.news-base-secure-tls.service: news-base-secure
      traefik.http.routers.news-base-secure-tls.tls: "true"
    volumes:
