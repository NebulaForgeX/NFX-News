    container_name: NFX-News-System-Base-Secure
    build:
      context: .
      dockerfile: inputs/system/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SYSTEM}"
    ports:
      - "${GRPC_EXT_PORT_SYSTEM}:${GRPC_PORT_SYSTEM}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.docker.network: nfx-edge
      traefik.http.services.news-system-base-secure.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.news-system-base-secure.entrypoints: web
      traefik.http.middlewares.nfx-news-system-gw-secure.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.news-system-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.news-system-base-secure.priority: "20"
      traefik.http.routers.news-system-base-secure.middlewares: nfx-news-system-gw-secure
      traefik.http.routers.news-system-base-secure.service: news-system-base-secure
      traefik.http.routers.news-system-base-secure-tls.entrypoints: websecure
      traefik.http.routers.news-system-base-secure-tls.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SYSTEM}`)
      traefik.http.routers.news-system-base-secure-tls.priority: "20"
      traefik.http.routers.news-system-base-secure-tls.middlewares: nfx-news-system-gw-secure
      traefik.http.routers.news-system-base-secure-tls.service: news-system-base-secure
      traefik.http.routers.news-system-base-secure-tls.tls: "true"
