      - nfx-edge
      - nfx-stack

  console:
    image: nfx-news-console:secure
    container_name: NFX-News-Console-Secure
    build:
      context: ./console
      dockerfile: Dockerfile
      target: secure
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
        VITE_BASE: ${VITE_BASE}
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.docker.network: nfx-edge
      traefik.http.services.news-console-secure.loadbalancer.server.port: "${CONSOLE_PORT}"
      traefik.http.routers.news-console-secure.entrypoints: web
      traefik.http.routers.news-console-secure.rule: Host(`${TRAEFIK_CONSOLE_HOST}`) && PathPrefix(`/console/nfx-news`)
      traefik.http.routers.news-console-secure.service: news-console-secure
      traefik.http.routers.news-console-secure.priority: "25"
      traefik.http.routers.news-console-secure-tls.entrypoints: websecure
      traefik.http.routers.news-console-secure-tls.rule: Host(`${TRAEFIK_CONSOLE_HOST}`) && PathPrefix(`/console/nfx-news`)
      traefik.http.routers.news-console-secure-tls.service: news-console-secure
      traefik.http.routers.news-console-secure-tls.tls: "true"
      traefik.http.routers.news-console-secure-tls.priority: "25"
    restart: always
    networks:
      - nfx-news
      - nfx-edge

networks:
  nfx-news:
    name: nfx-news-secure
    driver: bridge
  nfx-edge:
    external: true
    name: nfx-edge
  nfx-stack:
    external: true
    name: nfx-stack
