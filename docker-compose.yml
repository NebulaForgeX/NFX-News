name: nfx-news-secure

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  source-base:
    image: nfx-news-source-base:secure
    container_name: NFX-News-Source-Base-Secure
    build:
      context: .
      dockerfile: inputs/source/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SOURCE}"
    ports:
      - "${GRPC_EXT_PORT_SOURCE}:${GRPC_PORT_SOURCE}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.docker.network: nfx-edge
      traefik.http.services.news-source-base-secure.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.news-source-base-secure.entrypoints: web
      traefik.http.middlewares.nfx-news-source-gw-secure.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.news-source-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-base-secure.priority: "20"
      traefik.http.routers.news-source-base-secure.middlewares: nfx-news-source-gw-secure
      traefik.http.routers.news-source-base-secure.service: news-source-base-secure
      traefik.http.routers.news-source-base-secure-tls.entrypoints: websecure
      traefik.http.routers.news-source-base-secure-tls.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-base-secure-tls.priority: "20"
      traefik.http.routers.news-source-base-secure-tls.middlewares: nfx-news-source-gw-secure
      traefik.http.routers.news-source-base-secure-tls.service: news-source-base-secure
      traefik.http.routers.news-source-base-secure-tls.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
      - nfx-edge
      - nfx-stack

  news-base:
