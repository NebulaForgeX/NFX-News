name: nfx-news-secure
# Publish HTTP, gRPC, and console on ${NAS_IP}:host port.
# NFX-Edge routes to those ports. This file has no Traefik labels and no shared network.

services:

  source-base:
    image: nfx-news-source-base:secure
    container_name: NFX-News-Source-Base-Secure
    build:
      context: .
      dockerfile: inputs/source/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SOURCE}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_SOURCE}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_SOURCE}:${GRPC_PORT_SOURCE}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  news-base:
    image: nfx-news-news-base:secure
    container_name: NFX-News-News-Base-Secure
    build:
      context: .
      dockerfile: inputs/news/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_NEWS}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_NEWS}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_NEWS}:${GRPC_PORT_NEWS}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  crawl-base:
    image: nfx-news-crawl-base:secure
    container_name: NFX-News-Crawl-Base-Secure
    build:
      context: .
      dockerfile: inputs/crawl/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_CRAWL}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_CRAWL}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_CRAWL}:${GRPC_PORT_CRAWL}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  report-base:
    image: nfx-news-report-base:secure
    container_name: NFX-News-Report-Base-Secure
    build:
      context: .
      dockerfile: inputs/report/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_REPORT}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_REPORT}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_REPORT}:${GRPC_PORT_REPORT}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  notify-base:
    image: nfx-news-notify-base:secure
    container_name: NFX-News-Notify-Base-Secure
    build:
      context: .
      dockerfile: inputs/notify/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_NOTIFY}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_NOTIFY}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_NOTIFY}:${GRPC_PORT_NOTIFY}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  mcp-base:
    image: nfx-news-mcp-base:secure
    container_name: NFX-News-Mcp-Base-Secure
    build:
      context: .
      dockerfile: inputs/mcp/configuration/Dockerfile.Base
      target: secure
    env_file:
      - .secure.env
    environment:
      - ENV=secure
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_MCP}"
    ports:
      - "${NAS_IP}:${HTTP_EXT_PORT_MCP}:${HTTP_PORT}"
      - "${NAS_IP}:${GRPC_EXT_PORT_MCP}:${GRPC_PORT_MCP}"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always

  console:
    image: nfx-news-console:secure
    container_name: NFX-News-Console-Secure
    build:
      context: ./console
      dockerfile: Dockerfile
      target: secure
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_IDENTITY_API_URL: ${VITE_IDENTITY_API_URL}
        VITE_BASE: ${VITE_BASE}
    ports:
      - "${NAS_IP}:${CONSOLE_EXTERNAL_PORT}:${CONSOLE_PORT}"
    restart: always
