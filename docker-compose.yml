      traefik.http.routers.news-console-secure.service: news-console
      traefik.http.routers.news-console-secure.tls: "true"
      traefik.http.routers.news-console-secure.priority: "1"
    restart: always
    networks:
      - nfx-news
      - nfx-edge

networks:
  nfx-news:
    name: nfx-news
    driver: bridge
  nfx-edge:
    external: true
    name: nfx-edge
  nfx-stack:
    external: true
    name: nfx-stack
