      traefik.http.routers.news-notify-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_NOTIFY}`)
      traefik.http.routers.news-notify-base-secure.priority: "20"
      traefik.http.routers.news-notify-base-secure.middlewares: nfx-news-notify-gw-secure
      traefik.http.routers.news-notify-base-secure.service: news-notify-base-secure
      traefik.http.routers.news-notify-base-secure-tls.entrypoints: websecure
      traefik.http.routers.news-notify-base-secure-tls.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_NOTIFY}`)
      traefik.http.routers.news-notify-base-secure-tls.priority: "20"
      traefik.http.routers.news-notify-base-secure-tls.middlewares: nfx-news-notify-gw-secure
