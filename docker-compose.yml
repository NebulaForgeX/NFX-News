      traefik.http.middlewares.nfx-news-crawl-gw-secure.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.news-crawl-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_CRAWL}`)
      traefik.http.routers.news-crawl-base-secure.priority: "20"
      traefik.http.routers.news-crawl-base-secure.middlewares: nfx-news-crawl-gw-secure
      traefik.http.routers.news-crawl-base-secure.service: news-crawl-base-secure
      traefik.http.routers.news-crawl-base-secure-tls.entrypoints: websecure
      traefik.http.routers.news-crawl-base-secure-tls.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_CRAWL}`)
      traefik.http.routers.news-crawl-base-secure-tls.priority: "20"
      traefik.http.routers.news-crawl-base-secure-tls.middlewares: nfx-news-crawl-gw-secure
      traefik.http.routers.news-crawl-base-secure-tls.service: news-crawl-base-secure
      traefik.http.routers.news-crawl-base-secure-tls.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
