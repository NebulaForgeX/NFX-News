    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.services.news-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.news-base.entrypoints: web
      traefik.http.routers.news-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_NEWS}`)
      traefik.http.routers.news-base.service: news-base
      traefik.http.routers.news-base-secure.entrypoints: websecure
      traefik.http.routers.news-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_NEWS}`)
      traefik.http.routers.news-base-secure.service: news-base
      traefik.http.routers.news-base-secure.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
      - nfx-edge
      - nfx-stack

  crawl-base:
