      traefik.http.routers.news-report-base-secure.priority: "20"
      traefik.http.routers.news-report-base-secure.middlewares: nfx-news-report-gw-secure
      traefik.http.routers.news-report-base-secure.service: news-report-base-secure
      traefik.http.routers.news-report-base-secure-tls.entrypoints: websecure
      traefik.http.routers.news-report-base-secure-tls.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_REPORT}`)
      traefik.http.routers.news-report-base-secure-tls.priority: "20"
      traefik.http.routers.news-report-base-secure-tls.middlewares: nfx-news-report-gw-secure
      traefik.http.routers.news-report-base-secure-tls.service: news-report-base-secure
      traefik.http.routers.news-report-base-secure-tls.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always
    extra_hosts:
