      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
      - ./messages/langs:/app/messages/langs
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
