name: nfx-news

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  source-api:
    image: nfx-news-source-api:prod
    container_name: NFX-News-Source-Api
    build:
      context: .
      dockerfile: inputs/source/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.services.news-source-api.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.news-source-api.entrypoints: web
      traefik.http.routers.news-source-api.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-api.service: news-source-api
      traefik.http.routers.news-source-api-secure.entrypoints: websecure
      traefik.http.routers.news-source-api-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-api-secure.service: news-source-api
      traefik.http.routers.news-source-api-secure.tls: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
      - nfx-edge
    restart: unless-stopped

  source-connection:
    image: nfx-news-source-connection:prod
    container_name: NFX-News-Source-Connection
    build:
      context: .
      dockerfile: inputs/source/connection/Dockerfile
      target: prod
    environment:
      - ENV=prod
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SOURCE}"
    ports:
      - "${GRPC_PORT_SOURCE}:${GRPC_PORT_SOURCE}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    restart: unless-stopped

  source-pipeline:
