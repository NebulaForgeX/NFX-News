name: nfx-news

# HTTP 入口只有 NFX-Edge（先启动 Edge：共享网络 nfx-edge + Traefik）。
# 本栈不跑 reverse-proxy。traefik.project 由 Edge LabelRegex 发现。
# Must start NFX-Edge first (creates nfx-edge). This stack has no reverse-proxy.

services:
  source-base:
    image: nfx-news-source-base:prod
    container_name: NFX-News-Source-Base-Prod
    build:
      context: .
      dockerfile: inputs/source/configuration/Dockerfile.Base
      target: prod
    environment:
      - ENV=prod
    expose:
      - "${HTTP_PORT}"
      - "${GRPC_PORT_SOURCE}"
    ports:
      - "${GRPC_EXT_PORT_SOURCE}:${GRPC_PORT_SOURCE}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.services.news-source-base.loadbalancer.server.port: "${HTTP_PORT}"
      traefik.http.routers.news-source-base.entrypoints: web
      traefik.http.routers.news-source-base.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-base.service: news-source-base
      traefik.http.routers.news-source-base-secure.entrypoints: websecure
      traefik.http.routers.news-source-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_PREFIX_PATH_SOURCE}`)
      traefik.http.routers.news-source-base-secure.service: news-source-base
      traefik.http.routers.news-source-base-secure.tls: "true"
    volumes:
      - ./static:/app/static
      - ./data:/app/data
      - ./assets:/app/assets
      - ./errors/langs:/app/errors/langs
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
      - nfx-edge
      - nfx-stack

  news-base:
    image: nfx-news-news-base:prod
    container_name: NFX-News-News-Base-Prod
