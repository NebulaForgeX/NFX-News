      traefik.http.middlewares.nfx-news-mcp-gw-secure.stripprefix.prefixes: ${API_GATEWAY_PREFIX}
      traefik.http.routers.news-mcp-base-secure.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_MCP}`)
      traefik.http.routers.news-mcp-base-secure.priority: "20"
      traefik.http.routers.news-mcp-base-secure.middlewares: nfx-news-mcp-gw-secure
      traefik.http.routers.news-mcp-base-secure.service: news-mcp-base-secure
      traefik.http.routers.news-mcp-base-secure-tls.entrypoints: websecure
      traefik.http.routers.news-mcp-base-secure-tls.rule: Host(`${TRAEFIK_API_HOST}`) && PathPrefix(`${API_GATEWAY_PREFIX}${API_PREFIX_PATH_MCP}`)
      traefik.http.routers.news-mcp-base-secure-tls.priority: "20"
      traefik.http.routers.news-mcp-base-secure-tls.middlewares: nfx-news-mcp-gw-secure
      traefik.http.routers.news-mcp-base-secure-tls.service: news-mcp-base-secure
