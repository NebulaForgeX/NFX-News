name: nfx-news

services:
  reverse-proxy:
    image: traefik:latest
    container_name: NFX-News-Reverse-Proxy
    command:
      - --api.insecure=true
      - --providers.docker
      - --providers.docker.exposedByDefault=false
      - --providers.docker.constraints=Label(`traefik.project`, `nfx-news`)
      - --entrypoints.web.address=:${TRAEFIK_HTTP_INTERNAL_PORT}
      - --entrypoints.websecure.address=:${TRAEFIK_HTTPS_INTERNAL_PORT}
      - --entrypoints.traefik.address=:${TRAEFIK_DASHBOARD_INTERNAL_PORT}
    ports:
      - "${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_INTERNAL_PORT}"
      - "${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_INTERNAL_PORT}"
      - "${TRAEFIK_DASHBOARD_PORT}:${TRAEFIK_DASHBOARD_INTERNAL_PORT}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${TRAEFIK_DYNAMIC_DIR}:/etc/traefik/dynamic:ro
      - ${CERTS_DIR}:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    restart: unless-stopped





  source-api:
    image: nfx-news-source-api:prod
    container_name: NFX-News-Source-Api
    build:
      context: .
      dockerfile: inputs/source/api/Dockerfile
      target: prod
    environment:
      - ENV=prod
    expose:
      - "${HTTP_PORT}"
    labels:
      traefik.enable: "true"
      traefik.project: "nfx-news"
      traefik.http.routers.source-api.entrypoints: web
      traefik.http.routers.source-api.rule: PathPrefix(`${API_PREFIX_PATH_SOURCE}`)
      traefik.http.services.source-api.loadbalancer.server.port: "${HTTP_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nfx-news
    restart: unless-stopped
    depends_on:
      reverse-proxy:
        condition: service_started

  source-connection:
